[package]
name = "bmem"
version = "0.3.0"
edition = "2024"
publish = false
description = "Botinkit Memory local personal memory service and web workbench"

[features]
evaluation-clock = []
update-test = []

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled", "backup", "hooks", "functions"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
toml_edit = "0.22"
tough = "=0.24.0"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }
chrono-tz = "0.10.4"

[build-dependencies]
sha2 = "0.10"
