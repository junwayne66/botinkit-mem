[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botinkit-mem"
version = "0.1.0"
description = "Local personal memory service shared by coding harnesses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "mcp>=1.12,<2",
  "pydantic>=2.10,<3",
  "sqlite-vec==0.1.6",
  "zstandard>=0.23,<1",
  "tomlkit>=0.13,<1",
]

[project.urls]
Repository = "https://github.com/junwayne66/botinkit-mem"
Issues = "https://github.com/junwayne66/botinkit-mem/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
bmem = "bmem.cli:main"
bmemd = "bmem.cli:daemon_main"

[tool.hatch.build.targets.wheel]
packages = ["src/bmem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
